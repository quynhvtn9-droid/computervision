<style>
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { display: grid; place-items: center; padding: 24px 16px; background: rgb(238, 238, 238); font-family: Roboto-Regular, "Segoe UI", Arial, sans-serif; color: rgb(63, 74, 92); }
.is-unlocking .gate { visibility: hidden; }
.gate { width: 100%; max-width: 400px; padding: 28px 28px 22px; border: 1px solid rgb(232, 236, 243); border-radius: 16px; background: rgb(255, 255, 255); box-shadow: 0 12px 32px rgba(31, 42, 68, 0.08); }
.gate-badge { display: grid; place-items: center; width: 44px; height: 44px; margin-bottom: 16px; border-radius: 12px; background: rgb(238, 242, 252); color: rgb(61, 110, 245); }
.gate h1 { margin: 0 0 6px; font-size: 19px; font-weight: 700; line-height: 1.35; color: rgb(31, 42, 68); }
.gate-sub { margin: 0 0 20px; font-size: 13.5px; line-height: 1.55; color: rgb(106, 113, 128); }
.gate label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 600; color: rgb(31, 42, 68); }
.gate-field { position: relative; }
.gate-field input { width: 100%; height: 44px; padding: 0 46px 0 14px; border: 1px solid rgb(214, 221, 233); border-radius: 10px; background: rgb(255, 255, 255); color: rgb(31, 42, 68); font: inherit; font-size: 15px; outline: none; }
.gate-field input:focus { border-color: rgb(61, 110, 245); box-shadow: 0 0 0 3px rgba(61, 110, 245, 0.16); }
.gate-field.is-error input { border-color: rgb(192, 57, 43); box-shadow: 0 0 0 3px rgba(192, 57, 43, 0.12); }
.gate-eye { position: absolute; top: 4px; right: 4px; display: grid; place-items: center; width: 36px; height: 36px; border: 0; border-radius: 8px; background: none; color: rgb(118, 125, 140); cursor: pointer; }
.gate-eye:hover, .gate-eye:focus-visible { background: rgb(243, 246, 251); color: rgb(61, 110, 245); outline: none; }
.gate-eye .i-hide, .gate-eye[aria-pressed="true"] .i-show { display: none; }
.gate-eye[aria-pressed="true"] .i-hide { display: block; }
.gate-err { min-height: 20px; margin: 6px 0 2px; font-size: 12.5px; line-height: 1.5; color: rgb(192, 57, 43); }
.gate-go { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 44px; border: 0; border-radius: 10px; background: rgb(61, 110, 245); color: rgb(255, 255, 255); font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; }
.gate-go:hover { background: rgb(47, 94, 226); }
.gate-go:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(61, 110, 245, 0.35); }
.gate-go:disabled { cursor: progress; opacity: 0.75; }
.gate-spin { display: none; width: 16px; height: 16px; border: 2px solid rgba(255, 255, 255, 0.45); border-top-color: rgb(255, 255, 255); border-radius: 50%; animation: gateSpin 0.8s linear infinite; }
.gate-go:disabled .gate-spin { display: block; }
@keyframes gateSpin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .gate-spin { animation-duration: 2.4s; } }
.gate-note { display: flex; gap: 8px; margin: 18px 0 0; padding-top: 14px; border-top: 1px solid rgb(238, 240, 243); font-size: 12px; line-height: 1.5; color: rgb(118, 125, 140); }
.gate-note svg { flex: 0 0 auto; margin-top: 1px; color: rgb(31, 138, 76); }
</style>
</head>

  <p class="gate-note"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7.5 3v5.5c0 4.6-3.1 8.2-7.5 9.5-4.4-1.3-7.5-4.9-7.5-9.5V6z"/><path d="M9 12l2 2 4-4"/></svg><span>Nội dung được mã hoá ngay trong file. Không có mật khẩu thì không đọc được, kể cả khi mở mã nguồn.</span></p>

<script>
(function () {
  'use strict';
  var STORE = 'itv-gate-qJyaJMLfS02Y';
  var FONT_TOKEN = '/*__ITV_FONT_FACE__*/';
  var payload = JSON.parse(document.getElementById('gate-payload').textContent);
  var form = document.getElementById('gate-form');
  var input = document.getElementById('gate-pw');
  var field = document.getElementById('gate-field');
  var err = document.getElementById('gate-err');
  var go = document.getElementById('gate-go');
  var goText = document.getElementById('gate-go-text');
  var eye = document.getElementById('gate-eye');
  var subtle = window.crypto && window.crypto.subtle;

  function bytes(b64) { var s = atob(b64), u = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
  function toB64(buf) { var u = new Uint8Array(buf), s = ''; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  function deriveRaw(password) {
    return subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']).then(function (base) {
      return subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: bytes(payload.salt), iterations: payload.iter }, base, 256);
    });
  }
  function decryptWith(raw) {
    return subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']).then(function (key) {
      return subtle.decrypt({ name: 'AES-GCM', iv: bytes(payload.iv) }, key, bytes(payload.ct));
    }).then(function (plain) { return new TextDecoder().decode(plain); });
  }
  function open(html) {
    var font = document.getElementById('itv-font').textContent;
    html = html.split(FONT_TOKEN).join(font);
    // Chỉ thay trang khi file khoá đã tải xong; gọi document.open() lúc trình duyệt còn đang đọc trang
    // thì nội dung bị chèn vào sau màn mật khẩu thay vì thay thế nó.
    var swap = function () { document.open(); document.write(html); document.close(); };
    if (document.readyState === 'complete') swap();
    else window.addEventListener('load', swap, { once: true });
  }
  function showError(msg) {
    field.classList.add('is-error');
    err.textContent = msg;
    go.disabled = false;
    goText.textContent = 'Mở trang';
    input.focus();
    input.select();
  }
  function forget() { try { sessionStorage.removeItem(STORE); } catch (e) {} document.documentElement.className = ''; }

  if (!subtle) {
    showError('Trình duyệt này không giải mã được. Hãy mở file bằng Chrome, Edge hoặc Firefox bản mới (mở trực tiếp file, không qua trang xem trước).');
    go.disabled = true;
    forget();
    return;
  }

  // Đã mở trong tab này rồi: mở lại luôn, không hỏi lại (đóng tab là phải nhập lại).
  var saved = null;
  try { saved = sessionStorage.getItem(STORE); } catch (e) {}
  if (saved) decryptWith(bytes(saved)).then(open, forget);

  eye.addEventListener('click', function () {
    var show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    eye.setAttribute('aria-pressed', show ? 'true' : 'false');
    eye.setAttribute('aria-label', show ? 'Ẩn mật khẩu' : 'Hiện mật khẩu');
    input.focus();
  });
  input.addEventListener('input', function () { field.classList.remove('is-error'); err.textContent = ''; });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var pw = input.value;
    if (!pw) { showError('Bạn chưa nhập mật khẩu.'); return; }
    go.disabled = true;
    goText.textContent = 'Đang mở…';
    err.textContent = '';
    var raw;
    deriveRaw(pw).then(function (r) { raw = r; return decryptWith(r); }).then(function (html) {
      try { sessionStorage.setItem(STORE, toB64(raw)); } catch (e2) {}
      open(html);
    }, function () {
      showError('Mật khẩu không đúng. Kiểm tra lại chữ hoa, chữ thường.');
    });
  });
})();
</script>
