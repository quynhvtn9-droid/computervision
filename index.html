<title>Nhập mật khẩu để xem</title>
<style>
:root{--bg:#f5f6fa;--card:#ffffff;--text:#2b3a55;--muted:#5a6470;--line:#c3cbdb;--accent:#3565e8;--accent-ink:#ffffff;--tint:#eef1fb;--err:#b3261e;--field:#ffffff;--shadow:0 1px 2px rgba(20,30,60,.06),0 8px 24px rgba(20,30,60,.08)}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#12151c;--card:#1b202b;--text:#e6e9f2;--muted:#a3adc2;--line:#46516a;--accent:#7da2ff;--accent-ink:#0b1020;--tint:#232b3b;--err:#ff8a80;--field:#141924;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Roboto,"Segoe UI",Arial,sans-serif;font-size:14px;line-height:1.5;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:380px;background:var(--card);border-radius:16px;padding:28px 26px;box-shadow:var(--shadow)}
.ico{width:48px;height:48px;border-radius:12px;background:var(--tint);color:var(--accent);display:grid;place-items:center;margin-bottom:16px}
h1{margin:0 0 6px;font-size:20px;line-height:1.3;font-weight:700}
.sub{margin:0 0 20px;color:var(--muted)}
label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.field{position:relative}
input{width:100%;height:44px;padding:0 64px 0 12px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--text);font:inherit;font-size:15px}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tog{position:absolute;right:4px;top:4px;height:36px;min-width:52px;padding:0 8px;border:0;border-radius:8px;background:transparent;color:var(--accent);font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.err{min-height:20px;margin:6px 0 10px;font-size:13px;color:var(--err)}
.go{width:100%;height:44px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:inherit;font-size:15px;font-weight:700;cursor:pointer}
.go[disabled]{opacity:.7;cursor:progress}
.note{margin:16px 0 0;font-size:12.5px;color:var(--muted)}
</style>
</head>
<body>
<main class="card">
<div class="ico" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>
<h1>Nhập mật khẩu để xem</h1>
<p class="sub">Tài liệu này được bảo vệ bằng mật khẩu.</p>
<div id="f">
<label for="pw">Mật khẩu</label>
<div class="field">
<input id="pw" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-describedby="er">
<button type="button" class="tog" id="tg" aria-pressed="false" aria-label="Hiện mật khẩu">Hiện</button>
</div>
<div class="err" id="er" role="alert"></div>
<button type="button" class="go" id="go">Mở tài liệu</button>
</div>
<p class="note">Nội dung đã được mã hoá. Chỉ mở được khi nhập đúng mật khẩu.</p>

    H[0] = (H[0] + a) | 0; H[1] = (H[1] + b) | 0; H[2] = (H[2] + c) | 0; H[3] = (H[3] + d) | 0;
    H[4] = (H[4] + e) | 0; H[5] = (H[5] + f) | 0; H[6] = (H[6] + g) | 0; H[7] = (H[7] + h) | 0;
  }
  function load(B, off){ for (var i = 0; i < 16; i++) { var p = off + 4 * i; W[i] = (B[p] << 24) | (B[p + 1] << 16) | (B[p + 2] << 8) | B[p + 3]; } }
  function toBytes(H){ var o = new Uint8Array(32); for (var i = 0; i < 8; i++) { o[4 * i] = H[i] >>> 24; o[4 * i + 1] = (H[i] >>> 16) & 255; o[4 * i + 2] = (H[i] >>> 8) & 255; o[4 * i + 3] = H[i] & 255; } return o; }
  /* xử lý nốt thông điệp msg, biết trước đó đã nén prefix byte */
  function finish(H, msg, prefix){
    var n = msg.length, full = n - (n % 64), off;
    for (off = 0; off < full; off += 64) { load(msg, off); comp(H); }
    var rem = n - full, L = rem < 56 ? 64 : 128, tail = new Uint8Array(L);
    tail.set(msg.subarray(full)); tail[rem] = 0x80;
    var total = prefix + n, hi = Math.floor(total / 0x20000000), lo = (total * 8) >>> 0;
    tail[L - 8] = hi >>> 24; tail[L - 7] = (hi >>> 16) & 255; tail[L - 6] = (hi >>> 8) & 255; tail[L - 5] = hi & 255;
    tail[L - 4] = lo >>> 24; tail[L - 3] = (lo >>> 16) & 255; tail[L - 2] = (lo >>> 8) & 255; tail[L - 1] = lo & 255;
    load(tail, 0); comp(H); if (L === 128) { load(tail, 64); comp(H); }

  }
  function sha256(msg){ return toBytes(finish(new Int32Array(IV), msg, 0)); }
  /* khoá HMAC: trạng thái sau khi nén khối ipad / opad */
  function hmacKey(key){
    if (key.length > 64) key = sha256(key);
    var ip = new Uint8Array(64), op = new Uint8Array(64), i;
    for (i = 0; i < 64; i++) { var k = i < key.length ? key[i] : 0; ip[i] = k ^ 0x36; op[i] = k ^ 0x5c; }
    var hi = new Int32Array(IV), ho = new Int32Array(IV);
    load(ip, 0); comp(hi); load(op, 0); comp(ho);
    return { i: hi, o: ho };
  }
  function hmac(hk, msg){
    var inner = toBytes(finish(new Int32Array(hk.i), msg, 64));
    return toBytes(finish(new Int32Array(hk.o), inner, 64));
  }
  /* HMAC cho thông điệp ngắn đã ở dạng từ 32 bit (nw từ, nbytes byte): 2 lần nén, không cấp phát */
  var Hi = new Int32Array(8), Ho = new Int32Array(8);
  function hmacWords(hk, M, nw, nbytes){
    var i;
    Hi.set(hk.i);
    for (i = 0; i < nw; i++) W[i] = M[i];
    W[nw] = 0x80000000 | 0; for (i = nw + 1; i < 15; i++) W[i] = 0; W[15] = (64 + nbytes) * 8;
    comp(Hi);
    Ho.set(hk.o);
    for (i = 0; i < 8; i++) W[i] = Hi[i];
    W[8] = 0x80000000 | 0; for (i = 9; i < 15; i++) W[i] = 0; W[15] = 768;
    comp(Ho);
    return Ho;
  }
  /* PBKDF2-HMAC-SHA256, lấy 32 byte (1 khối) */
  function pbkdf2(pw, salt, iter){
    var hk = hmacKey(pw), s1 = new Uint8Array(salt.length + 4);
    s1.set(salt); s1[salt.length + 3] = 1;
    var u = hmac(hk, s1), U = new Int32Array(8), T = new Int32Array(8), i, j, r;
    for (i = 0; i < 8; i++) { U[i] = (u[4 * i] << 24) | (u[4 * i + 1] << 16) | (u[4 * i + 2] << 8) | u[4 * i + 3]; T[i] = U[i]; }
    for (j = 1; j < iter; j++) {
      r = hmacWords(hk, U, 8, 32);
      for (i = 0; i < 8; i++) { U[i] = r[i]; T[i] ^= r[i]; }
    }
    return toBytes(T);
  }
  /* dòng khoá: khối thứ c = HMAC(encKey, nonce(16 byte) || c(4 byte)); mã hoá và giải mã là cùng một phép XOR */
  function xorStream(encKey, nonce, data){
    var hk = hmacKey(encKey), M = new Int32Array(5), out = new Uint8Array(data.length), i, c, r, p, n = data.length;
    for (i = 0; i < 4; i++) M[i] = (nonce[4 * i] << 24) | (nonce[4 * i + 1] << 16) | (nonce[4 * i + 2] << 8) | nonce[4 * i + 3];
    for (c = 0, p = 0; p < n; c++) {
      M[4] = c; r = hmacWords(hk, M, 5, 20);

    }

  }
  function concat(){ var n = 0, i, o, p = 0; for (i = 0; i < arguments.length; i++) n += arguments[i].length; o = new Uint8Array(n); for (i = 0; i < arguments.length; i++) { o.set(arguments[i], p); p += arguments[i].length; } return o; }
  function ascii(s){ var o = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) o[i] = s.charCodeAt(i); return o; }
  function subkeys(master){ var hk = hmacKey(master); return { enc: hmac(hk, ascii('enc')), mac: hmac(hk, ascii('mac')) }; }
  function tag(macKey, salt, nonce, ct){ return hmac(hmacKey(macKey), concat(salt, nonce, ct)); }
  function same(a, b){ if (a.length !== b.length) return false; var d = 0; for (var i = 0; i < a.length; i++) d |= a[i] ^ b[i]; return d === 0; }
  return { sha256: sha256, hmacKey: hmacKey, hmac: hmac, pbkdf2: pbkdf2, xorStream: xorStream, subkeys: subkeys, tag: tag, same: same };
}

  var C = CvxLockCore();
  var D = JSON.parse(document.getElementById('cvx-data').textContent);
  function b64(s){ var bin = atob(s), o = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) o[i] = bin.charCodeAt(i); return o; }
  var salt = b64(D.s), nonce = b64(D.n), mac = b64(D.m), ct = null;
  var input = document.getElementById('pw'), go = document.getElementById('go'), er = document.getElementById('er'), tg = document.getElementById('tg');
  var busy = false;

  /* chuẩn hoá mật khẩu giống lúc đóng gói: bỏ khoảng trắng đầu/cuối, chuẩn Unicode NFC */
  function norm(s){ s = s.replace(/^\s+|\s+$/g, ''); return s.normalize ? s.normalize('NFC') : s; }
  /* PBKDF2: dùng Web Crypto nếu trình duyệt có (nhanh), không thì chạy bản JS thuần */
  function derive(pw){
    var pwb = new TextEncoder().encode(pw), subtle = window.crypto && window.crypto.subtle;
    var js = function(){ return new Promise(function(res){ setTimeout(function(){ res(C.pbkdf2(pwb, salt, D.it)); }, 30); }); };
    if (subtle && subtle.importKey && subtle.deriveBits) {
      try {
        return subtle.importKey('raw', pwb, 'PBKDF2', false, ['deriveBits'])
          .then(function(k){ return subtle.deriveBits({ name: 'PBKDF2', salt: salt, iterations: D.it, hash: 'SHA-256' }, k, 256); })
          .then(function(buf){ return new Uint8Array(buf); })
          .catch(js);
      } catch (e) { return js(); }
    }
    return js();
  }
  function fail(text){
    busy = false; go.disabled = false; go.textContent = 'Mở tài liệu';
    er.textContent = text; input.focus(); input.select();
  }
  tg.addEventListener('click', function(){
    var show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    tg.textContent = show ? 'Ẩn' : 'Hiện';
    tg.setAttribute('aria-pressed', show ? 'true' : 'false');
    tg.setAttribute('aria-label', show ? 'Ẩn mật khẩu' : 'Hiện mật khẩu');
    input.focus();
  });
  input.addEventListener('input', function(){ er.textContent = ''; });
  function unlock(){
    if (busy) return;
    var pw = norm(input.value);
    if (!pw) { fail('Vui lòng nhập mật khẩu.'); return; }
    busy = true; go.disabled = true; go.textContent = 'Đang mở…'; er.textContent = '';
    derive(pw).then(function(master){
      var k = C.subkeys(master);
      if (!ct) ct = b64(D.c);
      /* kiểm tra mã xác thực trước, đúng mật khẩu mới giải mã */
      if (!C.same(C.tag(k.mac, salt, nonce, ct), mac)) { fail('Mật khẩu không đúng. Vui lòng thử lại.'); return; }
      var html = new TextDecoder('utf-8').decode(C.xorStream(k.enc, nonce, ct));
      document.open(); document.write(html); document.close();
    }).catch(function(){ fail('Không mở được tài liệu trên trình duyệt này.'); });
  }
  /* bấm nút hoặc nhấn Enter trong ô mật khẩu */
  go.addEventListener('click', unlock);
  input.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.keyCode === 13) { e.preventDefault(); unlock(); } });
  try { input.focus(); } catch (e) {}
})();
